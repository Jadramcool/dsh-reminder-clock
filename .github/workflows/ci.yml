name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新推送取消上一次还在跑的 CI，省 runner 也省等待。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 构建 + 类型检查 + 两套 smoke（host 真 HTTP/真磁盘、client 真 React SSR/桩驱动）
  test:
    name: build · typecheck · smoke (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node 是 ^22.19.0 || >=24.0.0：下限与开发用的当前线各测一遍
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 版本取自 package.json 的 packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test

  # 桩 React 测不了订阅语义，所以真 React + 真 DOM 单独一个 job（需要浏览器）
  dom:
    name: real-React DOM smoke (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Locate Chrome
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::no Chrome/Chromium found on this runner"
            exit 1
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
      - run: pnpm test:dom
