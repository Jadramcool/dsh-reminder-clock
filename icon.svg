<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="dsh-reminder-clock">
  <defs>
    <linearGradient id="drc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#drc-bg)" />

  <!-- 表盘 -->
  <circle cx="32" cy="32" r="19" fill="#ffffff" />
  <circle cx="32" cy="32" r="19" fill="none" stroke="#1d4ed8" stroke-opacity=".16" stroke-width="2" />

  <!-- 指针：指 12:00 与 8:00，把右下角让给饭碗 -->
  <g stroke="#1d4ed8" stroke-linecap="round" fill="none">
    <line x1="32" y1="32" x2="32" y2="19.5" stroke-width="3.6" />
    <line x1="32" y1="32" x2="21.5" y2="36" stroke-width="3" />
  </g>
  <circle cx="32" cy="32" r="2.4" fill="#1d4ed8" />

  <!-- 饭碗 + 筷子：点题「干饭 / 收工」 -->
  <path d="M23.5 41h17a8.5 6.2 0 0 1-17 0z" fill="#f59e0b" />
  <path d="M22.6 41h18.8" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" />
  <g stroke="#b45309" stroke-width="1.5" stroke-linecap="round">
    <line x1="38.6" y1="35.2" x2="44.4" y2="29.6" />
    <line x1="41.4" y1="36.8" x2="47.2" y2="31.2" />
  </g>
</svg>
